boundaries:
  - This is a partial content import into an independent prototype workspace, not a migration of the old repository.
  - Current/completed membership status follows the public Team page as retrieved or explicit owner-provided records; it is not inferred from elapsed time.
  - No member portraits, private documents, fabricated dates, or inferred degrees were added. Xiaoyuan Liu's top-10%, Qisheng Lu's top-8%, Huachao Zhu's top-0.5% (1/173), and Youliang Yuan's top-4% (1/25) undergraduate statements are owner-provided and retain the supplied wording; other missing ranks remain absent. Owner-provided group and activity photos are separate homepage assets and do not establish member identities or headcounts.
  - Aoyang Fang, Zhiqing Zhong, Zhouruixing Zhu, and Songhan Zhang retain their earlier and current memberships in one person record.
  - Historical next steps are scoped to the completed membership; external arrivals were not independently verified.
  - Original Team first-author summaries remain intact. The more_papers batch adds publication metadata without inferring student supervision or author contribution, or changing member summaries.
  - The original publications plus sign denotes supervision, independently of first/co-first authorship.
  - Pinjia He uses explicit authorId pinjia-he; personId only references a member record present in this subset.
  - Publication dates use the conference year, not the preprint submission year.
  - Source retrieval dates do not assert when a statistic was measured.
